<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接手机 · Codex 消息助手</title><link rel="stylesheet" href="/style.css"><script src="/connect.js" defer></script></head>
<body class="connect-body"><main class="connect-card"><div class="appmark">⌘</div><p class="eyebrow">CODEX · 手机消息助手</p><h1>让手机接着聊。</h1><p id="setup-status">正在获取连接信息…</p><div id="setup" hidden><img id="qr" src="/api/local/qr.svg" alt="手机配对二维码" width="250" height="250"><ol><li>电脑和手机都连接 Tailscale。</li><li>用手机相机扫描二维码，打开后自动配对。</li><li>在浏览器中选择“添加到主屏幕”。</li></ol><label for="phone-link">手机访问地址</label><input id="phone-link" readonly><div class="button-row"><button id="copy" class="primary">复制配对链接</button><a class="button" href="/">在电脑上打开</a></div><details><summary>手动输入配对码</summary><p class="small">在手机上打开上方地址，再粘贴配对码。</p><input id="manual-token" type="password" readonly><button id="copy-token">复制配对码</button></details><p class="small">此二维码可控制这台电脑的 Codex，请仅供自己使用。<br>配对 30 天有效；Mac 与 Windows 分别扫描一次即可。</p><button id="stop" class="text-button">停止此电脑的手机连接</button></div><p id="setup-error" role="alert"></p></main></body></html>
